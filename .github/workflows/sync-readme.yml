name: Sync README with Medium RSS and Merged PRs

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_readme.py
      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "Harkanwal Bedi"
            git config user.email "bedi1887@gmail.com"
            git add README.md
            git commit -m "chore: auto-sync README with latest posts and merged PRs"
            git push
          fi
